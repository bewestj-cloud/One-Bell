<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Bell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EAE5; --surface:#F5F6F3; --ink:#1F2327; --muted:#5B636A; --line:#C8CEC7; --soft:#DADFD8;
  --bell:#E8B820; --danger:#B3362E;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#171A1D; --surface:#212529; --ink:#E5E8E3; --muted:#9AA2A8; --line:#353B40; --soft:#2A2F33; --danger:#E0695F; }
}
:root[data-theme="dark"]{ --bg:#171A1D; --surface:#212529; --ink:#E5E8E3; --muted:#9AA2A8; --line:#353B40; --soft:#2A2F33; --danger:#E0695F; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45; -webkit-tap-highlight-color:transparent; min-height:100%}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--bell); outline-offset:2px}
.app{max-width:560px; margin:0 auto; padding:0 18px 110px}
h1,h2,h3{font-family:var(--display); font-weight:800; line-height:.95; margin:0; letter-spacing:.01em}
p{margin:0}
.muted{color:var(--muted)}

/* figure */
svg.fig{display:block; width:100%; height:auto; overflow:visible}
.fig .limb{fill:none; stroke:var(--ink); stroke-linecap:round; stroke-linejoin:round; stroke-width:5.5}
.fig .torso{fill:none; stroke:var(--ink); stroke-linecap:round; stroke-width:7}
.fig .head{fill:var(--ink)}
.fig .ground{stroke:var(--line); stroke-width:2}
.fig .shadow{fill:var(--soft)}
.fig .bbody{fill:var(--bell)}
.fig .bhandle{fill:none; stroke:var(--bell); stroke-width:3.4}
.fig.small .limb{stroke-width:7}.fig.small .torso{stroke-width:8.5}

/* home */
.hero{display:grid; grid-template-columns:1.05fr 1fr; align-items:end; gap:8px; padding-top:22px}
.hero h1{font-size:clamp(64px,19vw,104px); font-weight:900; text-transform:none; line-height:.82}
.hero .tag{margin-top:12px; font-size:15px; color:var(--muted); max-width:22ch}
.hero .figwrap{margin-right:-10px}
.bellchip{display:inline-flex; align-items:center; gap:8px; margin-top:16px; padding:7px 12px 7px 8px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); cursor:pointer; font-weight:600; font-size:14px}
.dot{width:18px; height:18px; border-radius:50%; background:var(--bell); flex:none}
.weekstrip{display:flex; gap:6px; margin:26px 0 6px}
.weekstrip span{flex:1; height:8px; border-radius:4px; background:var(--soft)}
.weekstrip span.on{background:var(--ink)}
.weeklabel{font-size:13px; color:var(--muted)}
.list{margin-top:18px; border-top:1.5px solid var(--ink)}
.row{display:grid; grid-template-columns:54px 1fr auto; gap:14px; align-items:center; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:14px 2px; cursor:pointer}
.row .num{font-family:var(--display); font-weight:900; font-size:44px; line-height:.8}
.row .title{font-weight:700; font-size:17px}
.row .meta{font-size:13.5px; color:var(--muted)}
.row .thumb{width:62px}
.row .done{font-size:12px; color:var(--muted); text-align:right}
.warm .num{font-size:16px; font-family:var(--body); font-weight:700; line-height:1.1}

/* day */
.topbar{display:flex; align-items:center; gap:10px; padding:14px 0 6px}
.iconbtn{width:42px; height:42px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface); display:grid; place-items:center; cursor:pointer; flex:none}
.iconbtn svg{width:20px; height:20px; stroke:var(--ink); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.dayhead h2{font-size:54px; margin-top:8px}
.dayhead .fmt{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:10px; font-weight:600}
.seg{display:grid; grid-template-columns:repeat(3,1fr); background:var(--soft); border-radius:12px; padding:4px; margin-top:18px}
.seg button{border:0; background:none; padding:9px 4px; border-radius:9px; font-weight:600; font-size:14px; cursor:pointer; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 0 var(--line)}
.scalenote{font-size:14px; color:var(--muted); margin-top:10px; min-height:2.9em}
.moves{margin-top:10px; border-top:1.5px solid var(--ink)}
.mrow{display:grid; grid-template-columns:76px 1fr auto; gap:12px; align-items:center; width:100%; background:none; border:0; border-bottom:1px solid var(--line); padding:8px 2px; text-align:left; cursor:pointer}
.mrow .reps{font-family:var(--display); font-weight:800; font-size:28px; white-space:nowrap}
.mrow .nm{font-weight:600}
.mrow .pt{font-size:13px; color:var(--muted)}
.note{margin-top:16px; padding:14px 16px; border-left:4px solid var(--bell); background:var(--surface); border-radius:0 10px 10px 0; font-size:15px}
.check{display:flex; gap:10px; align-items:center; margin-top:18px; font-weight:600}
.check input{width:22px; height:22px; accent-color:var(--ink)}
.dock{position:fixed; left:0; right:0; bottom:0; padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px)); background:linear-gradient(to top, var(--bg) 70%, transparent); z-index:5}
.dock .inner{max-width:524px; margin:0 auto; display:flex; gap:10px}
.btn{flex:1; border:0; border-radius:14px; background:var(--ink); color:var(--bg); font-weight:700; font-size:17px; padding:17px 16px; cursor:pointer}
.btn.ghost{background:var(--surface); color:var(--ink); border:1.5px solid var(--line); flex:0 0 auto}
.btn:active{transform:scale(.985)}

/* tabs */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:4; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .inner{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}
.tabs button{border:0; background:none; padding:10px 0 12px; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px}
.tabs button svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink)}

/* sheet */
.scrim{position:fixed; inset:0; background:rgba(10,12,14,.45); z-index:20; display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--surface); width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:22px 22px 0 0; padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px)); animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px); opacity:.4}}
.grab{width:44px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 8px}
.sheet h3{font-size:36px; margin-top:4px}
.sheet .bigfig{background:var(--bg); border-radius:16px; padding:10px 18px 4px; margin:14px 0}
.cues{margin:0; padding-left:20px}
.cues li{margin:7px 0}

/* library */
.libgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:18px}
.libitem{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:8px 10px 10px; text-align:left; cursor:pointer}
.libitem .nm{font-weight:600; font-size:14px; line-height:1.25}
.libitem .pt{font-size:12px; color:var(--muted)}
.pagehead{padding-top:24px}
.pagehead h2{font-size:52px}
.pagehead p{margin-top:8px; color:var(--muted)}

/* log */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-top:18px}
.stats div{background:var(--surface); padding:12px}
.stats b{display:block; font-family:var(--display); font-size:34px; line-height:1}
.stats span{font-size:12.5px; color:var(--muted)}
.logrow{display:grid; grid-template-columns:1fr auto; gap:6px; padding:13px 2px; border-bottom:1px solid var(--line)}
.logrow .t{font-weight:700}
.logrow .s{font-size:14px; color:var(--muted)}
.logrow .score{font-family:var(--display); font-weight:800; font-size:26px; text-align:right}
.del{border:0; background:none; color:var(--danger); font-size:13px; padding:2px 0; cursor:pointer; text-align:right}
.empty{padding:40px 8px; text-align:center; color:var(--muted)}

/* bell tab */
.bellgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:8px; margin-top:16px}
.bellpick{border:1.5px solid var(--line); background:var(--surface); border-radius:14px; padding:10px 4px 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; font-weight:700}
.bellpick[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ink)}
.bellpick svg{width:34px; height:34px}
.bellpick small{font-weight:500; color:var(--muted); font-size:11.5px}
table{width:100%; border-collapse:collapse; margin-top:12px; font-size:14.5px}
th,td{text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); vertical-align:top}
th{font-weight:600; color:var(--muted); font-size:13px}
.sect{margin-top:30px}
.sect h3{font-size:30px}
.sect p{margin-top:8px}
.tests{counter-reset:t; margin:12px 0 0; padding:0; list-style:none}
.tests li{display:grid; grid-template-columns:34px 1fr; gap:8px; padding:10px 0; border-bottom:1px solid var(--line)}
.tests li::before{counter-increment:t; content:counter(t); font-family:var(--display); font-weight:900; font-size:30px; line-height:.9}
.toggle{display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); font-weight:600}
.toggle input{width:22px; height:22px; accent-color:var(--ink)}
.fine{font-size:12.5px; color:var(--muted); margin-top:26px}

/* session */
.session{position:fixed; inset:0; z-index:30; background:var(--bg); display:flex; flex-direction:column; padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.session .in{flex:1; display:flex; flex-direction:column; max-width:560px; width:100%; margin:0 auto; padding:10px 18px 16px; min-height:0}
.sbar{display:flex; align-items:center; gap:12px}
.sbar .where{flex:1; font-weight:600; font-size:14.5px}
.sbar .where small{display:block; color:var(--muted); font-weight:500}
.prog{height:6px; background:var(--soft); border-radius:3px; margin-top:10px; overflow:hidden}
.prog i{display:block; height:100%; background:var(--ink); transition:width .3s}
.stage{flex:1; display:flex; flex-direction:column; justify-content:center; min-height:0; text-align:center}
.stage .sfig{width:min(100%, 44vh); margin:0 auto}
.stage .label{font-weight:600; color:var(--muted); font-size:14px}
.stage .mname{font-family:var(--display); font-weight:800; font-size:clamp(34px,9vw,48px); line-height:.95; margin-top:6px}
.stage .mreps{font-family:var(--display); font-weight:900; font-size:clamp(64px,20vw,110px); line-height:.9; margin-top:6px}
.stage .cue{margin:10px auto 0; max-width:34ch; color:var(--muted); font-size:15px}
.clock{font-family:var(--display); font-weight:900; font-variant-numeric:tabular-nums; font-size:clamp(90px,30vw,170px); line-height:.85}
.clock.sm{font-size:clamp(56px,16vw,84px)}
.upnext{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:14px; font-size:14px; color:var(--muted)}
.upnext .th{width:44px}
.counter{display:flex; justify-content:center; gap:18px; align-items:baseline; margin-top:4px}
.counter b{font-family:var(--display); font-size:44px}
.sactions{display:flex; gap:10px; margin-top:12px}
.stepper{display:flex; align-items:center; justify-content:center; gap:18px; margin-top:14px}
.stepper button{width:52px; height:52px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface); font-size:26px; cursor:pointer}
.stepper b{font-family:var(--display); font-size:64px; min-width:1.4em}
textarea{width:100%; margin-top:12px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); font:inherit; padding:12px; min-height:84px}
.restring{position:relative; width:min(72vw,300px); margin:0 auto}
.restring svg{width:100%; transform:rotate(-90deg)}
.restring .c{position:absolute; inset:0; display:grid; place-items:center}
@media (prefers-reduced-motion: reduce){ .sheet{animation:none} .prog i{transition:none} }
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F2327">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div id="root"></div>
<script>
// ---------- Pose engine ----------
const GROUND = 158, CX = 100, LEN = { torso: 42, neck: 16, ua: 24, fa: 22, th: 30, sh: 30 }, HEAD_R = 8, BELL_R = 8.5;
const RAD = Math.PI / 180;
const V = (a, l) => [Math.sin(a * RAD) * l, Math.cos(a * RAD) * l];
const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
const ang = (d) => Math.atan2(d[0], d[1]) / RAD;
const ANGLES = ['t', 'hd', 'ua1', 'fa1', 'ua2', 'fa2', 'th1', 'sh1', 'th2', 'sh2', 'ft1', 'ft2', 'bA'];
const NUMS = ['x', 'lift', 'sw', 'hw', 'fl', 'bd', 'bz', 'bell', 'far'];

const SIDE = { x: 0, lift: 0, t: 180, hd: 0, ua1: 8, fa1: 8, ua2: 5, fa2: 5, th1: 2, sh1: 0, th2: -2, sh2: 0, ft1: 90, ft2: 90, sw: 0, hw: 0, fl: 11, grip: 'both', bA: null, bd: 9, bz: 0, bell: 1, gAll: 0, gBell: 0, anc: null, far: 0.42, gx: 0 };
const FRONT = { ...SIDE, sw: 12, hw: 6, fl: 6, far: 1, ft1: 80, ft2: -80, th1: 6, th2: -6, ua1: 14, fa1: 8, ua2: -14, fa2: -8 };

function skeleton(p) {
  const hip = [0, 0];
  const sh = add(hip, V(p.t, LEN.torso));
  const perp = [-Math.cos(p.t * RAD), Math.sin(p.t * RAD)];
  const head = add(sh, V(p.t + p.hd, LEN.neck));
  const S1 = [sh[0] + perp[0] * p.sw, sh[1] + perp[1] * p.sw], S2 = [sh[0] - perp[0] * p.sw, sh[1] - perp[1] * p.sw];
  const H1 = [perp[0] * p.hw, perp[1] * p.hw], H2 = [-perp[0] * p.hw, -perp[1] * p.hw];
  const E1 = add(S1, V(p.ua1, LEN.ua)), W1 = add(E1, V(p.fa1, LEN.fa));
  const E2 = add(S2, V(p.ua2, LEN.ua)), W2 = add(E2, V(p.fa2, LEN.fa));
  const K1 = add(H1, V(p.th1, LEN.th)), A1 = add(K1, V(p.sh1, LEN.sh)), T1 = add(A1, V(p.ft1, p.fl));
  const K2 = add(H2, V(p.th2, LEN.th)), A2 = add(K2, V(p.sh2, LEN.sh)), T2 = add(A2, V(p.ft2, p.fl));
  return { hip, sh, head, S1, S2, H1, H2, E1, W1, E2, W2, K1, A1, T1, K2, A2, T2 };
}

// resolve IK hand targets (h1/h2 relative to hip) into angles
function ik(S, target, bend) {
  const d = [target[0] - S[0], target[1] - S[1]];
  let dist = Math.hypot(d[0], d[1]);
  const a = LEN.ua, b = LEN.fa;
  dist = Math.min(Math.max(dist, Math.abs(a - b) + 0.5), a + b - 0.3);
  const base = ang(d);
  const alpha = Math.acos((a * a + dist * dist - b * b) / (2 * a * dist)) / RAD;
  const ua = base + bend * alpha;
  const E = add(S, V(ua, a));
  const fa = ang([target[0] - E[0], target[1] - E[1]]);
  return [ua, fa];
}
function P(base, o) {
  const p = { ...base, ...o };
  if (p.h1 || p.h2) {
    const sk = skeleton(p);
    if (p.h1) [p.ua1, p.fa1] = ik(sk.S1, p.h1, p.b1 ?? 1);
    if (p.h2) [p.ua2, p.fa2] = ik(sk.S2, p.h2, p.b2 ?? -1);
    delete p.h1; delete p.h2;
  }
  if (p.bA == null) p.bA = p.grip === 'w2' ? p.fa2 : p.fa1;
  return p;
}
const S_ = (o) => P(SIDE, o), F_ = (o) => P(FRONT, o);

function lerpAng(a, b, t) { let d = ((b - a) % 360 + 540) % 360 - 180; return a + d * t; }
function blend(A, B, t) {
  const p = {};
  for (const k of ANGLES) p[k] = lerpAng(A[k], B[k], t);
  for (const k of NUMS) p[k] = A[k] + (B[k] - A[k]) * t;
  return p;
}
function gripPt(sk, spec) {
  if (spec.grip === 'w1') return sk.W1;
  if (spec.grip === 'w2') return sk.W2;
  return [(sk.W1[0] + sk.W2[0]) / 2, (sk.W1[1] + sk.W2[1]) / 2];
}
function bellLocal(sk, spec, p) {
  const g = gripPt(sk, spec);
  return add(g, V(p.bA, p.bd));
}
function groundY(sk, spec, p, bellPos) {
  let m = Math.max(sk.A1[1] + 2, sk.A2[1] + 2, sk.T1[1] + 1.5, sk.T2[1] + 1.5);
  if (spec.gAll) m = Math.max(m, sk.K1[1] + 3, sk.K2[1] + 3, sk.W1[1] + 2, sk.W2[1] + 2, sk.E1[1] + 3, sk.E2[1] + 3, sk.hip[1] + 3, sk.sh[1] + 3, sk.head[1] + 6);
  if (spec.gBell && spec.grip !== 'floor' && bellPos) m = Math.max(m, bellPos[1] + BELL_R);
  return GROUND - m - spec.lift;
}
function offX(sk, spec) {
  const pt = spec.anc === 'w1' ? sk.W1 : spec.anc === 'w2' ? sk.W2 : spec.anc === 'toe1' ? sk.T1 : spec.anc === 'toe2' ? sk.T2 : [0, 0];
  return CX + spec.x - pt[0];
}

// full world geometry for blend of keyframes A,B at t
function frame(A, B, t) {
  const p = blend(A, B, t);
  const sk = skeleton(p);
  const bl = bellLocal(sk, A, p), blB = bellLocal(sk, B, p);
  const gA = groundY(sk, A, p, bl), gB = groundY(sk, B, p, blB);
  const oy = gA + (gB - gA) * t, ox = offX(sk, A) + (offX(sk, B) - offX(sk, A)) * t;
  const W = {};
  for (const k in sk) W[k] = [sk[k][0] + ox, sk[k][1] + oy];
  const bw = (spec, local) => spec.grip === 'floor' ? [W[spec.anc === 'w2' ? 'W2' : 'W1'][0] + spec.gx, GROUND - BELL_R] : [local[0] + ox, local[1] + oy];
  const b1 = bw(A, bl), b2 = bw(B, blB);
  const bell = [b1[0] + (b2[0] - b1[0]) * t, b1[1] + (b2[1] - b1[1]) * t];
  const g1 = A.grip === 'floor' ? null : gripPt(W, A), g2 = B.grip === 'floor' ? null : gripPt(W, B);
  let grip = g1 && g2 ? [g1[0] + (g2[0] - g1[0]) * t, g1[1] + (g2[1] - g1[1]) * t] : (t < 0.5 ? g1 : g2);
  return { W, p, bell, grip };
}

const f = (n) => n.toFixed(1);
const line = (...pts) => 'M' + pts.map((q) => f(q[0]) + ' ' + f(q[1])).join('L');
function geomStrings(fr) {
  const { W, p, bell, grip } = fr;
  const farD = line(W.S2, W.E2, W.W2) + line(W.H2, W.K2, W.A2, W.T2);
  const nearD = line(W.S1, W.E1, W.W1) + line(W.H1, W.K1, W.A1, W.T1);
  const torsoD = line(W.hip, W.sh) + (p.sw > 1 ? line(W.S1, W.S2) : '') + (p.hw > 1 ? line(W.H1, W.H2) : '');
  let hx = bell[0], hy = bell[1] - 9;
  if (grip) {
    const dx = grip[0] - bell[0], dy = grip[1] - bell[1], l = Math.hypot(dx, dy);
    if (l > 2) { hx = bell[0] + dx / l * 9; hy = bell[1] + dy / l * 9; }
  }
  return { farD, nearD, torsoD, head: W.head, bell, handle: [hx, hy], showBell: p.bell > 0.5, behind: p.bz > 0.5, far: p.far, shadowX: (W.A1[0] + W.A2[0] + W.hip[0]) / 3 };
}
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function sample(ex, ms) {
  const n = ex.frames.length, durs = ex.frames.map((_, i) => (ex.durs && ex.durs[i]) || ex.dur || 700);
  const total = durs.reduce((a, b) => a + b, 0);
  let tm = ms % total, i = 0;
  while (tm > durs[i]) { tm -= durs[i]; i++; }
  const hold = ex.hold || 0.12;
  let u = Math.min(1, Math.max(0, (tm / durs[i] - hold) / (1 - hold)));
  return geomStrings(frame(ex.frames[i], ex.frames[(i + 1) % n], ease(u)));
}

}
let wake = null;
async function keepAwake(on) { try { if (on && 'wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); else if (wake) { wake.release(); wake = null; } } catch (e) {} }

// ---------- Session ----------
let SES = null, tick = null;
function buildSteps(d) {
  const steps = [];
  if (S.warm || !d) WARMUP.forEach(([id, reps]) => steps.push({ k: 'move', id, reps, sect: 'Warm-up' }));
  if (!d) return steps;
  const sc = d.scale[scaleOf(d)];
  if (d.kind === 'rounds' && !sc.cap) {
    for (let r = 1; r <= sc.rounds; r++) {
      if (sc.burpees && sc.burpees.includes(r)) steps.push({ k: 'move', id: 'squatjump', reps: '10 burpees', alt: 'Burpees over the bell', sect: `Round ${r} of ${sc.rounds}` });
      d.moves.forEach(([id, reps]) => steps.push({ k: 'move', id, reps, sect: `Round ${r} of ${sc.rounds}`, round: r, timer: id === 'run' ? (scaleOf(d) === 'easy' ? 45 : 60) : 0 }));
      if (r < sc.rounds && sc.rest) steps.push({ k: 'rest', secs: sc.rest, sect: `Rest before round ${r + 1}` });
    }
  } else {
    if (d.kind === 'core') steps.push({ k: 'plank', which: 1, sect: 'Opening plank' });
    steps.push({ k: 'amrap', cap: sc.cap, moves: d.moves, sect: `${sc.cap}-minute AMRAP` });
    if (d.kind === 'core') steps.push({ k: 'plank', which: 2, sect: 'Closing plank' });
  }
  steps.push({ k: 'done', sect: 'Finished' });
  return steps;
}
function startSession(d) {
  if (actx === null) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  SES = { d, steps: buildSteps(d), i: 0, start: Date.now(), res: { rounds: 0, score: 0, extra: 0, plank1: 0, plank2: 0 } };
  keepAwake(true);
  const wrap = h('<div class="session"><div class="in"></div></div>');
  document.body.appendChild(wrap); document.body.style.overflow = 'hidden';
  SES.el = wrap.querySelector('.in');
  showStep();
}
function endSession() {
  clearInterval(tick); keepAwake(false);
  document.querySelector('.session')?.remove(); document.body.style.overflow = '';
  const d = SES && SES.d; SES = null;
  if (d) openDay(d); else render();
}
function nextStep() { clearInterval(tick); SES.i++; showStep(); }
function header(step) {
  const total = SES.steps.length - 1, pct = Math.min(100, (SES.i / total) * 100);
  return `<div class="sbar"><button class="iconbtn" id="x" aria-label="End session">${ICON.close}</button>
    <div class="where">${esc(step.sect)}<small>${SES.d ? 'Day ' + SES.d.n + ', ' + esc(SES.d.title) : 'Warm-up'}</small></div>
    <div class="muted" id="el" style="font-variant-numeric:tabular-nums;font-weight:600">${mmss((Date.now() - SES.start) / 1000)}</div></div>
    <div class="prog"><i style="width:${pct}%"></i></div>`;
}
function bindHeader() {
  $('#x', SES.el).onclick = () => {
    const done = SES.steps[SES.i].k === 'done';
    if (done || confirm('End this session? It will not be saved to your log.')) endSession();
  };
}
function everySec(fn) { clearInterval(tick); fn(); tick = setInterval(() => { const el = $('#el', SES.el); if (el) el.textContent = mmss((Date.now() - SES.start) / 1000); fn(); }, 250); }
function nextMoveStep() { for (let j = SES.i + 1; j < SES.steps.length; j++) if (SES.steps[j].k === 'move') return SES.steps[j]; return null; }

function showStep() {
  const st = SES.steps[SES.i], E = SES.el;
  E.innerHTML = header(st);
  if (st.k === 'move') {
    const nx = SES.steps[SES.i + 1];
    const upnext = nx ? (nx.k === 'move' ? MOVES[nx.id].name : nx.k === 'rest' ? `Rest ${nx.secs} s` : nx.k === 'done' ? 'Finish' : nx.sect) : '';
    const stage = h(`<div class="stage"><div class="sfig"></div><div class="mname">${esc(st.alt || MOVES[st.id].name)}</div><div class="mreps">${/^\d/.test(st.reps) ? '×' : ''}${esc(st.reps)}</div>
      <p class="cue">${esc(MOVES[st.id].cues[0])}</p>
      ${st.timer ? `<div class="clock sm" id="rt" style="margin-top:8px">${mmss(st.timer)}</div>` : ''}
      ${upnext ? `<div class="upnext">Up next: ${esc(upnext)}</div>` : ''}</div>`);
    stage.querySelector('.sfig').appendChild(figure(st.id, { animate: true }));
    FIGS.forEach((f) => { if (stage.contains(f.svg)) f.animate = true; });
    stage.querySelector('.sfig').onclick = () => openMove(st.id);
    E.appendChild(stage);
    const acts = h(`<div class="sactions">${st.timer ? '<button class="btn ghost" id="tm">Start 60 s</button>' : ''}<button class="btn" id="nx">Done, next</button></div>`);
    E.appendChild(acts);
    if (st.timer) {
      const tb = $('#tm', E); tb.textContent = `Start ${st.timer} s`;
      tb.onclick = () => { const end = Date.now() + st.timer * 1000; tb.disabled = true; everySec(() => { const left = (end - Date.now()) / 1000; $('#rt', E).textContent = mmss(left); if (left <= 0) { clearInterval(tick); beep(660, .25, 2); } }); };
    }
    $('#nx', E).onclick = nextStep;
  } else if (st.k === 'rest') {
    const nm = nextMoveStep();
    const C = 2 * Math.PI * 54;
    const stage = h(`<div class="stage"><p class="label">Rest</p><div class="restring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--soft)" stroke-width="8"/><circle id="ring" cx="60" cy="60" r="54" fill="none" stroke="var(--bell)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="c"><div class="clock" id="rc">${mmss(st.secs)}</div></div></div>
      ${nm ? `<div class="upnext"><span class="th"></span>Next: ${esc(MOVES[nm.id].name)} ×${esc(nm.reps)}</div>` : ''}</div>`);
    if (nm) stage.querySelector('.th').appendChild(figure(nm.id, { small: true }));
    E.appendChild(stage);
    E.appendChild(h(`<div class="sactions"><button class="btn ghost" id="add">+15 s</button><button class="btn" id="nx">Skip rest</button></div>`));
    let end = Date.now() + st.secs * 1000, total = st.secs, warned = new Set();
    $('#add', E).onclick = () => { end += 15000; total += 15; };
    $('#nx', E).onclick = nextStep;
    everySec(() => {
      const left = (end - Date.now()) / 1000;
      $('#rc', E).textContent = mmss(left);
      $('#ring', E).setAttribute('stroke-dashoffset', C * (1 - Math.max(0, left) / total));
      const s = Math.ceil(left); if (s <= 3 && s > 0 && !warned.has(s)) { warned.add(s); beep(660, .1); }
      if (left <= 0) { beep(990, .3); nextStep(); }
    });
  } else if (st.k === 'amrap') {
    amrap(st);
  } else if (st.k === 'plank') {
    const stage = h(`<div class="stage"><div class="sfig"></div><div class="mname">Forearm plank</div><p class="cue">Hold until your form breaks. Tap Stop the moment the hips sag.</p><div class="clock" id="pc" style="margin-top:10px">0:00</div></div>`);
    stage.querySelector('.sfig').appendChild(figure('plank', { animate: true }));
    E.appendChild(stage);
    E.appendChild(h(`<div class="sactions"><button class="btn" id="go">Start plank</button></div>`));
    let t0 = 0;
    $('#go', E).onclick = (ev) => {
      if (!t0) { t0 = Date.now(); ev.target.textContent = 'Stop'; beep(880, .12); everySec(() => { $('#pc', E).textContent = mmss((Date.now() - t0) / 1000); }); }
      else { clearInterval(tick); SES.res['plank' + st.which] = Math.round((Date.now() - t0) / 1000); beep(660, .2); nextStep(); }
    };
  } else if (st.k === 'done') {
    finish();
  }
  bindHeader();
}

function amrap(st) {
  const E = SES.el; let started = 0, mi = 0, rounds = 0;
  const stage = h(`<div class="stage">
    <div class="clock sm" id="ac">${mmss(st.cap * 60)}</div>
    <div class="counter"><span class="muted">Rounds</span><b id="rn">0</b><span class="muted" id="mv">Move 1 of ${st.moves.length}</span></div>
    <div class="sfig" style="width:min(100%,34vh)"></div>
    <div class="mname" id="mn"></div><div class="mreps" id="mr" style="font-size:clamp(52px,14vw,80px)"></div>
    <div class="upnext" id="up"></div></div>`);
  E.appendChild(stage);
  const acts = h(`<div class="sactions"><button class="btn" id="go">Start ${st.cap}:00 clock</button></div>`);
  E.appendChild(acts);
  function showMove() {
    const [id, reps] = st.moves[mi], nx = st.moves[(mi + 1) % st.moves.length];
    const fw = stage.querySelector('.sfig'); fw.innerHTML = ''; fw.appendChild(figure(id, { animate: true }));
    FIGS.forEach((f) => { if (fw.contains(f.svg)) f.animate = true; });
    fw.onclick = () => openMove(id);
    $('#mn', E).textContent = MOVES[id].name; $('#mr', E).textContent = '×' + reps;
    $('#mv', E).textContent = `Move ${mi + 1} of ${st.moves.length}`; $('#rn', E).textContent = rounds;
    $('#up', E).textContent = 'Up next: ' + MOVES[nx[0]].name;
  }
  showMove();
  let warned = new Set();
  $('#go', E).onclick = (ev) => {
    if (!started) {
      started = Date.now(); beep(880, .15, 2);
      acts.innerHTML = '<button class="btn ghost" id="bk" aria-label="Previous move">Back</button><button class="btn" id="nm">Done, next move</button>';
      $('#nm', E).onclick = () => { mi++; if (mi >= st.moves.length) { mi = 0; rounds++; beep(990, .12); } showMove(); };
      $('#bk', E).onclick = () => { if (mi > 0) mi--; else if (rounds > 0) { rounds--; mi = st.moves.length - 1; } showMove(); };
      everySec(() => {
        const left = st.cap * 60 - (Date.now() - started) / 1000;
        $('#ac', E).textContent = mmss(left);
        const s = Math.ceil(left); if (s <= 3 && s > 0 && !warned.has(s)) { warned.add(s); beep(660, .1); }
        if (left <= 0) { clearInterval(tick); beep(990, .4, 3); score(rounds, mi); }
      });
    }
  };
  function score(r, m) {
    let extraGuess = 0; for (let j = 0; j < m; j++) extraGuess += parseInt(st.moves[j][1]) || 0;
    SES.res.score = r; SES.res.extra = extraGuess;
    E.innerHTML = header(st);
    const sc = h(`<div class="stage"><p class="label">Time. Your score</p><div class="mname">Full rounds</div>
      <div class="stepper"><button id="rm" aria-label="One less round">−</button><b id="rv">${r}</b><button id="rp" aria-label="One more round">+</button></div>
      <div class="mname" style="font-size:26px;margin-top:18px">Extra reps</div>
      <div class="stepper"><button id="em" aria-label="Fewer reps">−</button><b id="ev" style="font-size:44px">${extraGuess}</b><button id="ep" aria-label="More reps">+</button></div></div>`);
    E.appendChild(sc);
    const upd = () => { $('#rv', E).textContent = SES.res.score; $('#ev', E).textContent = SES.res.extra; };
    $('#rm', E).onclick = () => { SES.res.score = Math.max(0, SES.res.score - 1); upd(); };
    $('#rp', E).onclick = () => { SES.res.score++; upd(); };
    $('#em', E).onclick = () => { SES.res.extra = Math.max(0, SES.res.extra - 1); upd(); };
    $('#ep', E).onclick = () => { SES.res.extra++; upd(); };
    E.appendChild(h(`<div class="sactions"><button class="btn" id="nx">Save score</button></div>`));
    $('#nx', E).onclick = nextStep;
    bindHeader();
  }
}

function finish() {
  const E = SES.el, d = SES.d, dur = Math.round((Date.now() - SES.start) / 1000);
  if (!d) {
    E.appendChild(h(`<div class="stage"><div class="mname">Warmed up</div><p class="cue">${mmss(dur)}. Pick a session and go.</p></div>`));
    E.appendChild(h(`<div class="sactions"><button class="btn" id="ok">Done</button></div>`));
    $('#ok', E).onclick = endSession; return;
  }
  const sc = d.scale[scaleOf(d)];
  const isR = d.kind === 'rounds' && !sc.cap;
  if (isR) SES.res.rounds = sc.rounds;
  const entry = { id: Date.now(), date: Date.now(), day: d.n, kind: isR ? 'rounds' : 'amrap', scale: scaleOf(d), bell: S.bell, dur, ...SES.res };
  const prev = S.log.filter((e) => e.day === d.n).pop();
  let cmp = '';
  if (prev && entry.kind === 'amrap') {
    const a = entry.score * 1000 + entry.extra, b = prev.score * 1000 + (prev.extra || 0);
    cmp = a > b ? 'New best compared with last time.' : a === b ? 'Level with last time.' : `Last time: ${scoreText(prev)}.`;
  }
  E.appendChild(h(`<div class="stage"><p class="label">Session done</p><div class="mreps">${scoreText(entry)}</div>
    <p class="cue">${mmss(dur)} total with the ${S.bell} kg bell. ${cmp}${entry.plank1 ? ` Planks: ${mmss(entry.plank1)} and ${mmss(entry.plank2)}.` : ''}</p>
    <textarea id="nt" placeholder="Notes: where did the wheels fall off?"></textarea></div>`));
  E.appendChild(h(`<div class="sactions"><button class="btn ghost" id="no">Discard</button><button class="btn" id="ok">Save to log</button></div>`));
  $('#ok', E).onclick = () => { entry.note = $('#nt', E).value.trim(); S.log.push(entry); save(); tab = 'log'; clearInterval(tick); keepAwake(false); document.querySelector('.session')?.remove(); document.body.style.overflow = ''; SES = null; render(); scrollTo(0, 0); };
  $('#no', E).onclick = () => { if (confirm('Discard this session?')) endSession(); };
}

document.addEventListener('visibilitychange', () => { if (SES && document.visibilityState === 'visible') keepAwake(true); });
render();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
